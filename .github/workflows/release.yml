name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run build:mac
            artifact: release/*.dmg
            name: macOS
          - os: windows-latest
            command: npm run build:win
            artifact: release/*.exe
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MochiMinder-${{ matrix.name }}
          path: ${{ matrix.artifact }}

      - name: Add installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" ${{ matrix.artifact }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
